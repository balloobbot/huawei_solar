# Development tooling only: the integration itself is installed by HACS from
# the repository root and is not built as a Python package.
[project]
name = "huawei-solar-integration"
version = "0.0.0"
# 3.14.2 rather than 3.14: that is the floor Home Assistant 2026.8 itself
# declares, and uv cannot resolve the dev group without it.
requires-python = ">=3.14.2"

[tool.uv]
package = false
# litellm only ships wheels for macOS arm64 from 1.96.0, and is not involved in
# what these tests exercise.
override-dependencies = ["litellm>=1.96.0"]

[dependency-groups]
dev = [
    # Tests run against the oldest Home Assistant the code actually works on,
    # which is the 2026.8.0 hacs.json declares: the device registry only takes
    # the via_device_id arguments __init__.py passes it from that release on.
    "pytest-homeassistant-custom-component==0.13.354",
    # config_flow.py imports serial and homeassistant.components.usb at module
    # level, so the usb integration's own requirements have to be present.
    "aiousbwatcher==1.1.1",
    "pyserial==3.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
